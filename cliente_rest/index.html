<!doctype html>
<html>

<head>
    <meta charset="utf8">
    <title>Aplicación Gestor</title>
    <style>
        :root {
    --primary-color: #4f46e5;
    --primary-hover: #4338ca;
    --bg-body: #f8fafc;
    --bg-card: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border-color: #e2e8f0;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-color: var(--bg-body);
    color: var(--text-main);
    line-height: 1.6;
    padding: 40px 20px;
}

h1 {
    font-weight: 800;
    letter-spacing: -0.025em;
    color: #0f172a;
    margin-bottom: 30px;
}

h2 {
    font-size: 1.5rem;
    font-weight: 700;
    color: #334155;
}

.seccion {
    max-width: 900px;
    margin: 0 auto 20px auto;
    background: var(--bg-card);
    padding: 32px;
    border-radius: 12px;
    border: 1px solid var(--border-color);
    box-shadow: var(--shadow);
    transition: transform 0.2s ease;
}

.activa {
    display: block;
    animation: fadeIn 0.3s ease-in-out;
}

input, select {
    width: 100%;
    max-width: 400px;
    padding: 10px 14px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-size: 0.95rem;
    color: var(--text-main);
    background-color: #fff;
    transition: border-color 0.2s, box-shadow 0.2s;
    display: block;
    margin-top: 5px;
}

input:focus, select:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
}

button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 10px 20px;
    font-weight: 600;
    font-size: 0.9rem;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s;
    background-color: var(--primary-color);
    color: white;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
}

button:hover {
    background-color: var(--primary-hover);
    transform: translateY(-1px);
}

td button {
    padding: 6px 12px;
    font-size: 0.8rem;
    background-color: #f1f5f9;
    color: #475569;
    border: 1px solid #cbd5e1;
}

td button:hover {
    background-color: #e2e8f0;
    color: #1e293b;
}

table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    margin-top: 20px;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border-color);
}

th {
    background-color: #f8fafc;
    color: #64748b;
    font-weight: 600;
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border-color);
}

td {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border-color);
    background-color: #fff;
    font-size: 0.9rem;
}

tr:last-child td {
    border-bottom: none;
}

.boton-derecha {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 24px;
}

label {
    display: block;
    font-weight: 600;
    font-size: 0.9rem;
    color: #475569;
    margin-bottom: 4px;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
    </style> 
</head>

<body>

    <h1>Gestor</h1>

    <div id="acceso" class="seccion" style="display: block;">
        <h2>Acceso</h2>
        <div>Usuario: <input id="usuario" /></div> 
        <div>Contraseña: <input id="contraseña" type="password" /></div>
        <button onclick="login()">Entrar</button>
        <button onclick="cambiarSeccion('registro')">Registrarse</button>
    </div>

 

    <div id="home" class="seccion" style="display: none;">
        <h2>Inicio</h2>
        <p id="bienvenida">
            <span id="texto_bienvenida">Cargando datos...</span>
            
        </p>
        
    </div>


    <script src="rest.js"></script>
    <script src="main.js"></script>

</body>
</html>
